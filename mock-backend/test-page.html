<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mock Kiosk Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    #payment-result { margin-top: 16px; padding: 8px; background: #f1f1f1; }
  </style>
</head>
<body>
  <h1>Mock Kiosk Test Page</h1>
  <p>This page triggers a START_PAYMENT message to the React Native wrapper on load and displays the result.</p>

  <div id="payment-result">waiting...</div>

  <script>
    function log(msg) { console.log('[test-page]', msg); }

    // Post a START_PAYMENT to the RN wrapper on load
    function start() {
      const payload = { type: 'START_PAYMENT', amount: 1299, currency: 'usd' };
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        log('posting START_PAYMENT');
        window.ReactNativeWebView.postMessage(JSON.stringify(payload));
      } else {
        log('ReactNativeWebView not available');
        document.getElementById('payment-result').innerText = 'ReactNativeWebView not available';
      }
    }

    // Listen for messages from native
    window.addEventListener('message', (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'PAYMENT_RESULT') {
          const el = document.getElementById('payment-result');
          if (msg.success) el.innerText = 'Payment succeeded: ' + (msg.paymentIntentId || 'unknown');
          else el.innerText = 'Payment failed: ' + (msg.errorMessage || 'unknown error');
        }
      } catch (err) {
        log('invalid message', err);
      }
    });

    // Delay slightly to ensure RN WebView is ready
    setTimeout(start, 500);
  </script>
</body>
</html>
